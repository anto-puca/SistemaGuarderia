<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Zona</title>
    <link th:href="@{https://jsdelivr.net}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">

    <!-- CONFLICTO DE DUPLICIDAD DE LETRA -->
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
        <strong>⚠️ Conflicto de Parámetros:</strong> <span th:text="${mensajeError}">Texto del error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
            <h4 class="mb-0" th:text="${zona.letra != null and !zona.letra.empty} ? '✏️ Editar Dimensiones de Zona' : '➕ Crear Sector de Guardería'">Formulario</h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/zonas/guardar}" th:object="${zona}" method="post">

                <input type="hidden" name="isAlta" th:value="${zona.letra == null or zona.letra.empty} ? 'true' : 'false'" />

                <h5 class="text-secondary border-bottom pb-2 mb-3">Identificación Física</h5>

                <div class="mb-3">
                    <label class="form-label fw-bold">Letra Identificadora del Sector</label>
                    <input type="text" th:field="*{letra}" class="form-control text-uppercase" required
                           placeholder="ej: A" maxlength="1"
                           th:readonly="${zona.letra != null and !zona.letra.empty}" />
                    <div class="form-text" th:if="${zona.letra != null and !zona.letra.empty}">La clave alfabética no se puede modificar una vez establecida.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Tipo de Vehículo Autorizado para esta Zona</label>
                    <select th:field="*{tipoVehiculo}" class="form-select" required>
                        <option value="" hidden>-- Seleccione la Categoría Permitida --</option>
                        <option value="Motorhomes">Motorhomes</option>
                        <option value="Casas rodantes de arrastre">Casas rodantes de arrastre</option>
                        <option value="Caravanas">Caravanas</option>
                        <option value="Trailers">Trailers</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Número de vehículos iniciales contenidos</label>
                    <input type="number" th:field="*{cantidadVehiculos}" class="form-control" min="0" required placeholder="0" />
                </div>

                <h5 class="text-secondary border-bottom pb-2 mb-3 mt-4">Métricas Estándar de los Garages en esta Zona</h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Profundidad (Metros)</label>
                        <input type="number" step="0.1" th:field="*{profundidadGarages}" class="form-control" required placeholder="6.5" />
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Ancho (Metros)</label>
                        <input type="number" step="0.1" th:field="*{anchoGarages}" class="form-control" required placeholder="3.2" />
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/zonas}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">Guardar Zona</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{https://jsdelivr.net}"></script>
</body>
</html>
