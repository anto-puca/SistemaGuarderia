<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Asignación de Área</title>
    <link th:href="@{https://jsdelivr.net}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark text-center">
            <h4 class="mb-0">⚙️ Configurar Responsabilidad de Zona</h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/asignaciones/guardar}" th:object="${asignacion}" method="post">

                <!-- SELECCIÓN DE EMPLEADO -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Seleccionar Empleado</label>
                    <select th:field="*{empleado}" class="form-select" required>
                        <option value="" hidden>-- Seleccione un Operario --</option>
                        <option th:each="emp : ${empleados}" th:value="${emp.id}" th:text="${emp.nombre} + ' [' + ${emp.codigo} + ']'"></option>
                    </select>
                </div>

                <!-- SELECCIÓN DE ZONA -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Seleccionar Zona de la Guardería</label>
                    <select th:field="*{zona}" class="form-select" required>
                        <option value="" hidden>-- Seleccione una Letra de Zona --</option>
                        <option th:each="z : ${zonas}" th:value="${z.letra}" th:text="'Zona ' + ${z.letra}"></option>
                    </select>
                </div>

                <!-- ATRIBUTO PROPIO DE LA RELACIÓN -->
                <div class="mb-4">
                    <label class="form-label fw-bold">Cantidad de Vehículos a Cargo</label>
                    <input type="number" th:field="*{cantidadVehiculosACargo}" class="form-control" min="0" required placeholder="0" />
                    <div class="form-text">Establezca el cupo operativo máximo asignado para este sector.</div>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/asignaciones}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-warning px-4 fw-semibold">Guardar Asignación</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
