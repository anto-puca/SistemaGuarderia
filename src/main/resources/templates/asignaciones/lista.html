<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Zonas de Trabajo</title>
    <link th:href="@{https://jsdelivr.net}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm me-2">⬅️ Volver</a>
            <h2 class="d-inline-block align-middle mb-0">Asignación de Empleados a Zonas</h2>
        </div>
        <a th:href="@{/asignaciones/nueva}" class="btn btn-warning">➕ Nueva Asignación</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Empleado (Código)</th>
                    <th>Zona Asignada</th>
                    <th>Vehículos bajo Responsabilidad</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="asig : ${asignaciones}">
                    <td th:text="${asig.empleado.nombre} + ' (' + ${asig.empleado.codigo} + ')'">Juan Perez (EMP-01)</td>
                    <td class="fw-bold text-primary" th:text="'Zona ' + ${asig.zona.letra}">Zona A</td>
                    <td th:text="${asig.cantidadVehiculosACargo}">15</td>
                    <td class="text-center">
                        <a th:href="@{/asignaciones/eliminar(empleadoId=${asig.empleado.id},zonaId=${asig.zona.letra})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Remover esta zona del cargo del empleado?')">❌ Quitar Cargo</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(asignaciones)}">
                    <td colspan="4" class="text-center text-muted py-4">No hay áreas operativas asignadas al personal actualmente.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
