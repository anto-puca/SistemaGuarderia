<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Empleado</title>
    <link th:href="@{https://jsdelivr.net}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-success text-white text-center">
            <h4 class="mb-0" th:text="${empleado.id != null} ? '✏️ Editar Empleado' : '➕ Registrar Empleado'">
                Formulario</h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/empleados/guardar}" th:object="${empleado}" method="post">
                <!-- Inputs de control ocultos -->
                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:field="*{tipoUsuario}"/>

                <h5 class="text-secondary border-bottom pb-2 mb-3">Credenciales de Usuario</h5>
                <div class="mb-3">
                    <label class="form-label">Nombre de Usuario</label>
                    <input type="text" th:field="*{username}" class="form-control" required placeholder="ej: cgomez"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" th:field="*{password}" class="form-control" required placeholder="••••••••"/>
                </div>

                <h5 class="text-secondary border-bottom pb-2 mb-3 mt-4">Información del Puesto</h5>
                <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Carlos Gómez"/>
                </div>
                <div class="mb-4">
                    <label class="form-label">Código de Fichaje o Legajo</label>
                    <input type="text" th:field="*{codigo}" class="form-control" required placeholder="ej: EMP-105"/>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/empleados}" class="btn btn-secondary">Volver al listado</a>
                    <button type="submit" class="btn btn-success px-4">Guardar Empleado</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
