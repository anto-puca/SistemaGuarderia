<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Empleados</title>
    <!--<link th:href="@{https://jsdelivr.net}" rel="stylesheet"> -->
    <!-- Ejemplo para agregar en lista.html de socios y empleados -->
    <a th:href="@{/}" class="btn btn-outline-secondary me-2">⬅️ Volver al Panel</a>

</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Personal (Empleados)</h2>
        <a th:href="@{/empleados/nuevo}" class="btn btn-success">➕ Registrar Nuevo Empleado</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID Usuario</th>
                    <th>Código Interno</th>
                    <th>Nombre y Apellido</th>
                    <th>Username</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp : ${empleados}">
                    <td th:text="${emp.id}">1</td>
                    <td th:text="${emp.codigo}">EMP-001</td>
                    <td th:text="${emp.nombre}">Carlos Gómez</td>
                    <td th:text="${emp.username}">cgomez</td>
                    <td class="text-center">
                        <a th:href="@{/empleados/editar/{id}(id=${emp.id})}" class="btn btn-warning btn-sm">✏️ Editar</a>
                        <a th:href="@{/empleados/eliminar/{id}(id=${emp.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Estás seguro de eliminar a este empleado y su cuenta asociada?')">❌ Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(empleados)}">
                    <td colspan="5" class="text-center text-muted py-4">No hay personal de alta en el sistema.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
