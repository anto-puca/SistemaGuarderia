<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Socios</title>

    <!--<link th:href="@{https://jsdelivr.net}" rel="stylesheet"> -->
    <!-- Ejemplo para agregar en lista.html de socios y empleados -->
    <!-- ENLACE LOCAL A BOOSTRAP COMPATIBLE CON THYMELEAF -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>

    <a th:href="@{/}" class="btn btn-outline-secondary me-2">⬅️ Volver al Panel</a>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Socios - Guardería</h2>
        <a th:href="@{/socios/antiguedad}" class="btn btn-outline-primary fw-semibold">📋 Ver Reporte Cronológico</a>
        <a th:href="@{/socios/nuevo}" class="btn btn-primary">➕ Registrar Nuevo Socio</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover vertical-align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID Usuario</th>
                    <th>Username</th>
                    <th>Nombre</th>
                    <th>DNI</th>
                    <th>Fecha de Ingreso</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="socio : ${socios}">
                    <td th:text="${socio.id}">1</td>
                    <td th:text="${socio.username}">user123</td>
                    <td th:text="${socio.nombre}">Juan Pérez</td>
                    <td th:text="${socio.dni}">12345678</td>
                    <td th:text="${socio.fechaIngreso}">2026-10-25</td>
                    <td class="text-center">
                        <a th:href="@{/socios/editar/{id}(id=${socio.id})}" class="btn btn-warning btn-sm">✏️ Editar</a>
                        <a th:href="@{/socios/eliminar/{id}(id=${socio.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Estás seguro de eliminar este socio y su cuenta de usuario?')">❌ Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(socios)}">
                    <td colspan="6" class="text-center text-muted py-4">No hay socios registrados en el sistema.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<!-- SCRIPT LOCAL A BOOSTRAP COMPATIBLE CON THYMELEAF -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
