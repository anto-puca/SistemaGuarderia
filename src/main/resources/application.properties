# 1. PUERTO DEL SERVIDOR
server.port=8080

# 2. CONEXIÓN DIRECTA A MYSQL 8 (Aseguramos el puerto 3306 estándar y el esquema)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/guarderia_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. CONFIGURACIÓN COMPATIBLE DE HIBERNATE / JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. CONFIGURACIÓN DE DESARROLLO THYMELEAF
spring.thymeleaf.cache=false
